[build-system]
requires = ["scikit-build-core", "nanobind", "numpy>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "quakfilter"
version = "0.1.0"
description = "Modular state estimation building blocks — UKF, IMM, and multi-sensor fusion in C++ with Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  {name = "Vistralis Labs", email = "support@vistralis.org"}
]
keywords = [
    "kalman-filter",
    "ukf",
    "state-estimation",
    "tracking",
    "robotics",
    "computer-vision",
    "quaternion",
    "IMM",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "ruff",
    "numpy-quaternion",
    "pdoc",
]

[project.urls]
Homepage = "https://vistralis.org"
Documentation = "https://vistralis.org/quakfilter"
Source = "https://github.com/vistralis/quakfilter"
Issues = "https://github.com/vistralis/quakfilter/issues"

[tool.scikit-build]
cmake.version = ">= 3.15"
wheel.packages = ["src/quak"]
wheel.install-dir = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N806", "N803", "N802", "UP015"]
