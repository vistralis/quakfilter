name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
  CIBW_SKIP: "*-musllinux_*"
  CIBW_ARCHS_LINUX: "x86_64 aarch64"
  CIBW_BEFORE_BUILD_MACOS: >
    brew install libomp
  CIBW_ENVIRONMENT_MACOS: >
    OpenMP_ROOT=$(brew --prefix libomp)
    MACOSX_DEPLOYMENT_TARGET=14.0
  CIBW_TEST_COMMAND: >
    python -c "import numpy as np; from quak import UKF, RigidBodyCVModel;
    m = RigidBodyCVModel(); x0 = np.zeros(16); x0[9]=1.0;
    ukf = UKF(m, np.eye(15)*0.01, np.eye(6)*0.001, np.eye(15)*0.1, x0);
    ukf.predict(0.01); print('quakfilter OK')"

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build sdist
        run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: pip install cibuildwheel
      - name: Build wheels
        run: cibuildwheel --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  test-install:
    name: Verify install
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel
        run: pip install dist/*cp312*manylinux*x86_64*.whl
      - name: Smoke test
        run: |
          python -c "
          import numpy as np
          from quak import UKF, RigidBodyCVModel, __version__

          print(f'quakfilter v{__version__}')
          model = RigidBodyCVModel()
          x0 = np.zeros(16); x0[9] = 1.0
          ukf = UKF(model, np.eye(15)*0.01, np.eye(6)*0.001, np.eye(15)*0.1, x0)
          ukf.predict(0.01)
          print('quakfilter installed and verified')
          "

  github-release:
    name: GitHub Release
    needs: [build-sdist, build-wheels, test-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{sdist,wheels-*}"
          path: dist/
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

  publish-pypi:
    name: Publish to PyPI
    needs: [github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{sdist,wheels-*}"
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
